global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: repo-search-fastapi
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8000
          - auth-service:8000
          - catalog-service:8000
          - search-service:8000
          - query-service:8000
          - embedding-service:8000
          - job-service:8000

  - job_name: repo-search-workers
    static_configs:
      - targets:
          - job-worker:9100

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
