apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: repo-search
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: repo-search-fastapi
        metrics_path: /metrics
        static_configs:
          - targets:
              - gateway:8000
              - auth-service:8000
              - catalog-service:8000
              - search-service:8000
              - query-service:8000
              - embedding-service:8000
              - job-service:8000

      - job_name: repo-search-workers
        static_configs:
          - targets:
              - job-worker:9100

      - job_name: postgres
        static_configs:
          - targets:
              - postgres-exporter:9187

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics:8080

      - job_name: node-exporter
        static_configs:
          - targets:
              - node-exporter:9100

      - job_name: dcgm-exporter
        static_configs:
          - targets:
              - dcgm-exporter:9400
