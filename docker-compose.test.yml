name: repo-search-tests

services:
  pgvector-test:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: repo_search_test
      POSTGRES_USER: repo_search_test
      POSTGRES_PASSWORD: repo_search_test
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo_search_test -d repo_search_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql
