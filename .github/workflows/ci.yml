name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit and PostgreSQL tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed'
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: repo-search-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_DATABASE_URL: postgresql://repo_search_test:repo_search_test@127.0.0.1:55432/repo_search_test
      TEST_DB_PORT: "55432"
      OTEL_TRACING_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-dev.txt

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run complete unit suite
        run: python -m pytest -m unit -q

      - name: Start isolated PostgreSQL and pgvector
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Verify pgvector test database
        run: |
          docker compose -f docker-compose.test.yml exec -T pgvector-test \
            psql -v ON_ERROR_STOP=1 -U repo_search_test -d repo_search_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run complete PostgreSQL and pgvector suite
        run: python -m pytest -m integration -q

      - name: Show isolated database logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color || true

      - name: Stop isolated test database
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans

      - name: Verify isolated database cleanup
        if: always()
        shell: bash
        run: |
          test -z "$(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
          test -z "$(docker volume ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
          test -z "$(docker network ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed' || github.event.pull_request.merged == true
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend application
        working-directory: frontend
        run: npm run build

      - name: Verify frontend build output
        shell: bash
        run: |
          test -f frontend/dist/index.html
          test -n "$(find frontend/dist/assets -maxdepth 1 -type f -print -quit)"

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  configuration-validation:
    name: Compose and Kubernetes validation
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed'
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          docker compose -f docker-compose.microservices.yml config --quiet
          docker compose -f docker-compose.test.yml config --quiet

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1

      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize k8s > /dev/null
          kubectl kustomize k8s-gpu > /dev/null

  artifact-verification:
    name: Build artifact verification
    runs-on: ubuntu-latest
    needs: [frontend-build]
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed' || github.event.pull_request.merged == true
    timeout-minutes: 5

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Verify downloaded artifact
        shell: bash
        run: |
          test -f frontend-dist/index.html
          test -n "$(find frontend-dist/assets -maxdepth 1 -type f -print -quit)"
