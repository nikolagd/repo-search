services:
  evaluation-runner:
    image: repo-search-eval-search-service
    pull_policy: never
    working_dir: /workspace
    entrypoint: ["python", "-m", "evaluation"]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      EVALUATION_DATABASE_URL: "postgresql://${DB_USER:-repo_search}:${DB_PASSWORD:-repo_search_password}@db-primary:5432/${DB_NAME:-repo_search}"
      EVALUATION_API_TOKEN: "${API_TOKEN:-local-dev-api-token-change-me}"
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: bind
        source: ${EVALUATION_QUERIES_DIR:-./.codex-tmp/evaluation/queries}
        target: /evaluation-input
        read_only: true
      - type: bind
        source: ${EVALUATION_RUNS_DIR:-./.codex-tmp/evaluation/runs}
        target: /evaluation-output
