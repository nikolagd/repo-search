name: repo-search-microservices

services:
  db-primary:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${DB_NAME:-repo_search}
      POSTGRES_USER: ${DB_USER:-repo_search}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-repo_search_password}
      POSTGRES_REPLICATION_USER: ${DB_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD:-repo_search_replication_password}
    volumes:
      - shared_db_primary_data:/var/lib/postgresql
      - ./docker/postgres/init-primary-replication.sh:/docker-entrypoint-initdb.d/010-init-primary-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-replica:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${DB_NAME:-repo_search}
      POSTGRES_USER: ${DB_USER:-repo_search}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-repo_search_password}
      POSTGRES_PRIMARY_HOST: db-primary
      POSTGRES_PRIMARY_PORT: 5432
      POSTGRES_REPLICATION_USER: ${DB_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD:-repo_search_replication_password}
    volumes:
      - shared_db_replica_data:/var/lib/postgresql
      - ./docker/postgres/start-replica.sh:/usr/local/bin/start-replica.sh:ro
    command: ["sh", "/usr/local/bin/start-replica.sh"]
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    command: uvicorn microservices.gateway.main:app --host 0.0.0.0 --port 8000
    environment:
      API_TOKEN: ${API_TOKEN:-local-dev-api-token-change-me}
      AUTH_SERVICE_URL: http://auth-service:8000
      CATALOG_SERVICE_URL: http://catalog-service:8000
      SEARCH_SERVICE_URL: http://search-service:8000
      JOB_SERVICE_URL: http://job-service:8000
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
    ports:
      - "${MICROSERVICE_GATEWAY_HOST_PORT:-8090}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-API-Key: $$API_TOKEN\" http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    command: uvicorn microservices.auth_service.main:app --host 0.0.0.0 --port 8000
    environment:
      DB_HOST: db-primary
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-repo_search}
      DB_USER: ${DB_USER:-repo_search}
      DB_PASSWORD: ${DB_PASSWORD:-repo_search_password}
      API_TOKEN: ${API_TOKEN:-local-dev-api-token-change-me}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-local-dev-admin-jwt-secret-change-me-32-bytes}
      ADMIN_JWT_EXPIRY_MINUTES: ${ADMIN_JWT_EXPIRY_MINUTES:-120}
      ADMIN_JWT_ROTATION_INTERVAL_MINUTES: ${ADMIN_JWT_ROTATION_INTERVAL_MINUTES:-15}
      ADMIN_JWT_MAX_SESSION_MINUTES: ${ADMIN_JWT_MAX_SESSION_MINUTES:-720}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-API-Key: $$API_TOKEN\" http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    command: uvicorn microservices.catalog_service.main:app --host 0.0.0.0 --port 8000
    environment:
      DB_HOST: db-primary
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-repo_search}
      DB_USER: ${DB_USER:-repo_search}
      DB_PASSWORD: ${DB_PASSWORD:-repo_search_password}
      API_TOKEN: ${API_TOKEN:-local-dev-api-token-change-me}
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-API-Key: $$API_TOKEN\" http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  search-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    command: uvicorn microservices.search_service.main:app --host 0.0.0.0 --port 8000
    environment:
      DB_HOST: db-primary
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-repo_search}
      DB_USER: ${DB_USER:-repo_search}
      DB_PASSWORD: ${DB_PASSWORD:-repo_search_password}
      API_TOKEN: ${API_TOKEN:-local-dev-api-token-change-me}
      QUERY_SERVICE_URL: http://query-service:8000
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
    depends_on:
      db-primary:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      query-service:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-API-Key: $$API_TOKEN\" http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  query-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    command: uvicorn microservices.query_service.main:app --host 0.0.0.0 --port 8000
    environment:
      API_TOKEN: ${API_TOKEN:-local-dev-api-token-change-me}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_URL: ${LLM_URL:-http://ollama:11434/api/generate}
      LLM_MODEL: ${LLM_MODEL:-gemma4:12b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-180}
      LLM_WARMUP_ENABLED: ${LLM_WARMUP_ENABLED:-1}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-API-Key: $$API_TOKEN\" http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  embedding-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    command: uvicorn microservices.embedding_service.main:app --host 0.0.0.0 --port 8000
    gpus: all
    environment:
      API_TOKEN: ${API_TOKEN:-local-dev-api-token-change-me}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - model_cache:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-API-Key: $$API_TOKEN\" http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  job-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    command: uvicorn microservices.job_service.main:app --host 0.0.0.0 --port 8000
    environment:
      DB_HOST: db-primary
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-repo_search}
      DB_USER: ${DB_USER:-repo_search}
      DB_PASSWORD: ${DB_PASSWORD:-repo_search_password}
      API_TOKEN: ${API_TOKEN:-local-dev-api-token-change-me}
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-API-Key: $$API_TOKEN\" http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  job-worker:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    command: python -m microservices.workers.job_worker
    environment:
      DB_HOST: db-primary
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-repo_search}
      DB_USER: ${DB_USER:-repo_search}
      DB_PASSWORD: ${DB_PASSWORD:-repo_search_password}
      API_TOKEN: ${API_TOKEN:-local-dev-api-token-change-me}
      CATALOG_SERVICE_URL: http://catalog-service:8000
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      SEARCH_SERVICE_URL: http://search-service:8000
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-15}
      WORKER_STALE_JOB_TIMEOUT_SECONDS: ${WORKER_STALE_JOB_TIMEOUT_SECONDS:-120}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      HARVEST_OUTPUT_DIR: /app/data
      METRICS_PORT: 9100
    depends_on:
      job-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    volumes:
      - harvest_xml_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_TOKEN: ${API_TOKEN:-local-dev-api-token-change-me}
      API_UPSTREAM: http://gateway:8000
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${MICROSERVICE_FRONTEND_HOST_PORT:-8091}:80"

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    volumes:
      - ollama_microservice_data:/root/.ollama
    ports:
      - "${MICROSERVICE_OLLAMA_HOST_PORT:-11435}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      gateway:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      query-service:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    restart: unless-stopped

  postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE:-prometheuscommunity/postgres-exporter:latest}
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-repo_search}:${DB_PASSWORD:-repo_search_password}@db-primary:5432/${DB_NAME:-repo_search}?sslmode=disable"
    depends_on:
      db-primary:
        condition: service_healthy
    restart: unless-stopped

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:latest}
    profiles: ["container-metrics"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "${CADVISOR_HOST_PORT:-8088}:8080"
    restart: unless-stopped

volumes:
  shared_db_primary_data:
  shared_db_replica_data:
  harvest_xml_data:
  model_cache:
  ollama_microservice_data:
  prometheus_data:
  grafana_data:
