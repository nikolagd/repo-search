    spec:
      containers:
        - name: embedding-service
          image: repo-search-microservices-embedding-service:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["microservices.embedding_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
