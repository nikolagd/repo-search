apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: repo-search
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: harvest-xml-data
  namespace: repo-search
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: repo-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: wait-for-db
          image: repo-search-microservices-job-service:latest
          imagePullPolicy: IfNotPresent
          command: ["python"]
          args:
            - -c
            - |
              import socket
              import time

              while True:
                  try:
                      socket.create_connection(("db-primary", 5432), timeout=5).close()
                      break
                  except OSError:
                      time.sleep(2)
      containers:
        - name: auth-service
          image: repo-search-microservices-auth-service:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["microservices.auth_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: repo-search-config
            - secretRef:
                name: repo-search-secret
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -fsS -H \"X-API-Key: $API_TOKEN\" http://localhost:8000/ready"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 12
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: repo-search
spec:
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
---
