apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: repo-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      initContainers:
        - name: wait-for-db
          image: repo-search-microservices-job-service:latest
          imagePullPolicy: IfNotPresent
          command: ["python"]
          args:
            - -c
            - |
              import socket
              import time

              while True:
                  try:
                      socket.create_connection(("db-primary", 5432), timeout=5).close()
                      break
                  except OSError:
                      time.sleep(2)
        - name: wait-for-search-dependencies
          image: repo-search-microservices-job-service:latest
          imagePullPolicy: IfNotPresent
          command: ["python"]
          args:
            - -c
            - |
              import os
              import time

              import requests

              token = os.environ["API_TOKEN"]
              services = [
                  "http://catalog-service:8000/ready",
                  "http://embedding-service:8000/ready",
              ]

              while True:
                  try:
                      for url in services:
                          response = requests.get(url, headers={"X-API-Key": token}, timeout=5)
                          response.raise_for_status()
                      break
                  except Exception:
                      time.sleep(2)
          envFrom:
            - configMapRef:
                name: repo-search-config
            - secretRef:
                name: repo-search-secret
      containers:
        - name: search-service
          image: repo-search-microservices-search-service:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["microservices.search_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: repo-search-config
            - secretRef:
                name: repo-search-secret
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -fsS -H \"X-API-Key: $API_TOKEN\" http://localhost:8000/ready"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 12
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: repo-search
spec:
  selector:
    app: search-service
  ports:
    - port: 8000
      targetPort: 8000
---
